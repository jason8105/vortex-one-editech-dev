name: Build 64-bit APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-64bit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build 64-bit Debug APK Only
        run: ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p output
          APK_FILE=$(find . -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!" && exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" output/app-arm64-v8a-debug.apk

      - name: Upload 64-bit Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: output/app-arm64-v8a-debug.apk
          if-no-files-found: error